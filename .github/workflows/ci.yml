name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 12.15.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.1
          cache: pnpm
      - name: Verify policy output boundary
        run: node .github/scripts/test-pnpm-policy-boundary.mjs
      - name: Verify effective dependency policy before installation
        run: node .github/scripts/verify-pnpm-policy.mjs before
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify installation preserved the dependency policy
        if: always()
        run: node .github/scripts/verify-pnpm-policy.mjs after
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: pnpm-policy-${{ runner.os }}-${{ github.job }}
          path: artifacts/pnpm-policy
          if-no-files-found: warn
          retention-days: 14
      - run: pnpm audit --audit-level=low
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm doctor:built

  browser-smoke:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --user 1001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 12.15.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.1
          cache: pnpm
      - name: Verify policy output boundary
        run: node .github/scripts/test-pnpm-policy-boundary.mjs
      - name: Verify effective dependency policy before installation
        run: node .github/scripts/verify-pnpm-policy.mjs before
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify installation preserved the dependency policy
        if: always()
        run: node .github/scripts/verify-pnpm-policy.mjs after
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: pnpm-policy-${{ runner.os }}-${{ github.job }}
          path: artifacts/pnpm-policy
          if-no-files-found: warn
          retention-days: 14
      - run: pnpm test:e2e

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.1
      - run: docker build --tag hulpgids:ci .
      - run: node scripts/check-container.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-verification
          path: artifacts/container-verification.json
          if-no-files-found: error
