name: Provider response boundaries
on:
  pull_request:
    paths:
      - server/_core/map.ts
      - server/_core/llm.ts
      - server/_core/providerResponse.ts
      - .github/qualification/provider-response-cases.cjs
      - .github/scripts/provider_response_proof.py
      - .github/workflows/provider-response-boundary.yml
permissions:
  contents: read
jobs:
  provider-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      npm_config_engine_strict: 'true'
      npm_config_strict_peer_deps: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '26.12.1'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.15.2'
      - name: Install normal current stable compiler with strict peers and engines
        run: |
          mkdir -p PROVIDER_RESPONSE_TOOLS PROVIDER_RESPONSE_EVIDENCE
          printf '%s\n' '{"private":true,"devDependencies":{"esbuild":"0.28.2"}}' > PROVIDER_RESPONSE_TOOLS/package.json
          cd PROVIDER_RESPONSE_TOOLS
          npm install --package-lock-only
          npm ci
          npm config get engine-strict > ../PROVIDER_RESPONSE_EVIDENCE/effective-engine-strict.txt
          npm config get strict-peer-deps > ../PROVIDER_RESPONSE_EVIDENCE/effective-strict-peer-deps.txt
          cp package.json package-lock.json ../PROVIDER_RESPONSE_EVIDENCE/
      - name: Execute identical original and patched production adapters against real owned HTTP
        run: python -B -I .github/scripts/provider_response_proof.py
      - name: Retain source actual graph compiler audit and real HTTP cases
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: provider-response-boundary-proof
          path: PROVIDER_RESPONSE_EVIDENCE
          if-no-files-found: error
          retention-days: 14
